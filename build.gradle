plugins {
    id 'java'
    id 'groovy'
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$dependencyManagementVersion"
}

group = 'az.vtb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //spring
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-aop"
    implementation "org.springframework.boot:spring-boot-starter-validation"

    //db
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.liquibase:liquibase-core"
    runtimeOnly "org.postgresql:postgresql"

    //lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    //swagger
    implementation "org.springframework.boot:spring-boot-starter-actuator:${actuatorVersion}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${webmvcVersion}"

    //testing
    testImplementation "org.apache.groovy:groovy:${groovyVersion}"
    testImplementation "org.spockframework:spock-spring:${spockVersion}"
    testImplementation "io.github.benas:random-beans:${enhanceRandom}"
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    //shedlock
    implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

    //rabbitmq
    implementation "org.springframework.boot:spring-boot-starter-amqp"

    //telegram-bots
    implementation "org.telegram:telegrambots:${telegrambotsVersion}"
    implementation "org.telegram:telegrambots-spring-boot-starter:${telegrambotsVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
}
